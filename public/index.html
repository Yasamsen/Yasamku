<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Axios Request Tester</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #171a23;
      border: 1px solid #292e3a;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .description {
      color: #9299a8;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      border: 1px solid #303746;
      background: #0e1118;
      color: #fff;
      padding: 13px 14px;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #667eea;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 15px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      background: #667eea;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      background: #202532;
    }

    .result {
      margin-top: 20px;
      background: #0b0e13;
      border: 1px solid #292e3a;
      border-radius: 12px;
      padding: 15px;
      max-height: 400px;
      overflow: auto;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: #d8deea;
      font-size: 13px;
      line-height: 1.6;
    }

    .warning {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.5;
      color: #999;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Axios Request Tester</h1>

    <div class="description">
      Test HTTP/HTTPS endpoint milik kamu menggunakan Axios.
    </div>

    <form id="testForm">

      <label for="target">
        Domain / URL
      </label>

      <input
        id="target"
        type="url"
        placeholder="https://api.yasamdev.web.id/"
        value="https://api.yasamdev.web.id/"
        required
      >

      <div class="row">

        <div>
          <label for="requests">
            Jumlah Request
          </label>

          <input
            id="requests"
            type="number"
            min="1"
            max="999999999999999"
            value="10"
            required
          >
        </div>

        <div>
          <label>
            &nbsp;
          </label>

          <button id="submitButton" type="submit">
            Mulai Test
          </button>
        </div>

      </div>

    </form>

    <div id="status" class="status"></div>

    <div class="result">
      <pre id="output">Belum ada hasil.</pre>
    </div>

    <div class="warning">
      Maksimal 50 request per test. Gunakan hanya pada domain/server
      yang kamu miliki atau yang memang memberikan izin untuk pengujian.
    </div>

  </div>

  <script>
    const form = document.getElementById("testForm");
    const targetInput = document.getElementById("target");
    const requestsInput = document.getElementById("requests");
    const button = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    const output = document.getElementById("output");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const target = targetInput.value.trim();
      const requests = Number(requestsInput.value);

      if (!target) {
        alert("Domain / URL wajib diisi.");
        return;
      }

      if (!Number.isInteger(requests) || requests < 1 || requests > 9999999999999) {
        alert("Jumlah request harus antara 1 sampai 50.");
        return;
      }

      button.disabled = true;
      button.textContent = "Testing...";

      statusBox.style.display = "block";
      statusBox.textContent = `Mengirim ${requests} request...`;

      output.textContent = "Sedang menjalankan test...";

      try {
        const response = await fetch("/api/test", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            target,
            requests
          })
        });

        const data = await response.json();

        statusBox.textContent = data.message || "Selesai.";

        output.textContent = JSON.stringify(
          data,
          null,
          2
        );

      } catch (error) {

        statusBox.textContent = "Request gagal.";

        output.textContent = JSON.stringify(
          {
            status: false,
            message: "Gagal menghubungi API tester.",
            error: error.message
          },
          null,
          2
        );

      } finally {
        button.disabled = false;
        button.textContent = "Mulai Test";
      }
    });
  </script>

</body>
</html>
